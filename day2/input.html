<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Tags</title>
  </head>
  <body>
    <label> Username</label>
    <input placeholder="Enter your name" />
    <!------ Input Types----->

    <input type="text" placeholder="username" /><br />
    <input type="email" placeholder="abc@example.com" /><br /><br />
    <input type="password" placeholder="*******" /><br /><br />
    <input type="url" placeholder="https://yoursite.com" /><br /><br />
    <input type="tel" placeholder=" +91 9878117339" /><br /><br />
    <!---Date and Time--->
    <input type="date" />
    <input type="time" />

    <input type="datetime-local" />
    <input type="month" />
    <input type="week" />

    <input type="checkbox" />
    <label> I agree to trems and conditions</label>
    <input type="file" />
    <input type="color" />
    <input type="range" />
    <input type="number" />
<!--  -->
<input type="text" minlength="3" maxlength="10"><br>
<input type="tel" placeholder="phone number"
    <input type="text" />
  </body>
</html>
