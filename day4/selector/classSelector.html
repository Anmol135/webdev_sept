<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" , initial-scale="1.0" />
    <title>Document</title>
    <style>
        .abc{
            color: pink;
        }
        .xyz{
            color: rgb(69, 231, 234);
        }
    </style>
  </head>
  <body>
    <!----Same Tag- Different Styles use ID Selector:#idname-->
    <h2 class="abc">Hello Everyone!</h2>
    <h2 class="xyz">Hello Everyone 2!</h2>
    <p class="abc">This is a paragraph.</p>
    <button class="xyz">Click Me!!</button>
    <div class="abc">Hello, This is Div Tag!</div>
  </body>
</html>
