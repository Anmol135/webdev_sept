<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" , initial-scale="1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--Div Container -I is a tag in which we can add content by using html tags. It always has 100 % width : by default it is a block level element -->
    <div style="background-color: rgb(250, 203, 211); width: 200px">
      <h2>Reviews</h2>

      <div style="background-color: rgb(184, 235, 255)">
        <h3>Sonia</h3>
        <p>Great restaurant!🍔</p>
      </div>
      <div style="background-color: rgb(184, 235, 255)">
        <h3>Meena</h3>
        <p>Great Experience!✨</p>
      </div>

      <div style="background-color: rgb(196, 255, 198); width: 200 px">
        <h2>Support</h2>
        <p>abc@support.com</p>
        <p>+91 98882677333</p>
        <p>Location: Delhi</p>
      </div>
    </div>
    <!---Span Tag: It only takes required amount of width as per content. It is an inline element . It can fit inside any HTML Tag.-->

    <p>
      Good
      <span style="background-color: orange"> Things are about to happen!</span>
    </p>

    <button>Cart 0</button>
    <button>Cart<span style="background-color: brown">0</span></button>
  </body>
</html>
